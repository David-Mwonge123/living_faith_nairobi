<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Prayer - Living Faith Nairobi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      
     
      body {
        font-family: "Times New Roman", Times, serif;
        background: var(--bg);
        color: var(--dark);
      }
      
      .container {
        max-width: 900px;
        margin: auto;
        padding: 3rem 1.8rem;
      }
      h1 {
        font-size: 3.5rem;
      }
      .radio-group {
        display: flex;
        gap: 1rem;
        margin: 1.5rem 0;
      }
      .radio-pill {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.2rem;
        border: 1.5px solid var(--dark);
        border-radius: 999px;
      }
      
      label.head {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--dark);
      }
      input,
      textarea {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1.5px solid var(--dark);
        padding: 0.9rem 0;
        margin-bottom: 1.5rem;
        font-size: 1rem;
      }
      
      textarea {
        border: 1.5px solid var(--dark);
        border-radius: 16px;
        padding: 1rem;
      }
      .btn-form {
        background: var(--main);
        color: white;
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        width: 100%;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    
    <div class="container">
      <span
        style="
          color: var(--main);
          font-size: 0.8rem;
          letter-spacing: 0.15em;
          font-weight: 600;
        "
        >PRAYER WALL</span
      >
      <h1>We pray for one another!</h1>
      <p style="color: var(--dark); margin-top: 0.6rem">
        Private : Only pastors see it. Public : Shared anonymously for church to
        pray. You are not alone!
      </p>

      <form style="margin-top: 2rem">
        <label class="head">Your Name</label>
        <input type="text" placeholder="Optional..." />

        <label class="head">Prayer Request</label>
        <textarea
          rows="5"
          placeholder="Share what is on your heart..." required aria-required="true"
        ></textarea>

        <label class="head">Visibility</label>
        <div class="radio-group">
          <label class="radio-pill"
            ><input type="radio" name="privacy" /> Private - Pastors
            only</label
          >
          <label class="radio-pill"
            ><input type="radio" name="privacy" /> Public - Share to prayer
            wall</label
          >
        </div>

        <button class="btn-form">Submit Request →</button>
      </form>

      
    </div>
  </body>
</html>
