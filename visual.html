<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitors - Living Faith Nairobi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--dark);
      }
      h1,
      h2 {
        font-family: "Instrument Serif", serif;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 3rem 1.8rem;
      }
      
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
        margin-top: 2rem;
        border-top: 1px solid var(--main);
        padding-top: 2.5rem;
      }
      label {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--dark);
      }
      input,
      select,
      textarea {
        width: 100%;
        background: transparent;
        border: none;
        border-bottom: 1.5px solid var(--dark);
        padding: 0.9rem  0.7rem;
        margin-bottom: 1.6rem;
        font-size: 1rem;
        transition: 0.3s;
      }
      
      textarea {
        border: 1.5px solid var(--dark);
        border-radius: 16px;
        padding: 1rem;
        margin-top: 0.5rem;
      }
      
      .btn-form {
        background: var(--main);
        color: white;
        padding: 0.9rem 1.8rem;
        border-radius: 999px;
        border: none;
        font-weight: 600;
        width: 100%;
      }
      .header {
        color: var(--main);
        font-size: 0.8rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 600;
      }
      @media (max-width: 800px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
      
    </style>
  </head>
  <body>
    <div class="container">
      <span class="header">You belong here</span>
      <h1 style="font-size: 3.8rem; line-height: 0.9; margin-top: 0.5rem">
        Just family.
      </h1>
      <div class="form-grid">
        <div>
          <h2 style="font-size: 2rem">First time visitor</h2>
          <p style="color: var(--dark); margin: 0.8rem 0 1.8rem">
            We won't call you out. Fill this and we will send a warm welcome
            text.
          </p>
          <form>
            <label>Full Name</label
            ><input type="text" placeholder="Your Full Name" required />
            <label>Phone / WhatsApp</label
            ><input type="tel" placeholder="+254..." required />
            <label>Visit Type</label
            ><select>
              <option>First time</option>
              <option>Second time</option>
              <option>Returning after long</option>
            </select>
            <label>How did you hear about us?</label
            ><input type="text" placeholder="Friend, Instagram,..." required />
            <label>Prayer or anything you need?</label
            ><textarea rows="4" placeholder="Optional..."></textarea>
            <button class="btn-form">Send Quietly</button>
          </form>
        </div>
        <div>
          <h2 style="font-size: 2rem">Serve with us</h2>
          <p style="color: var(--dark); margin: 0.8rem 0 1.8rem">
            You know the church well? Join any ministry you desire to serve in:
            Kids, Worship, Usher, Media, Outreach.
          </p>
          <form>
            <label>Full Name</label
            ><input type="text" placeholder="Your Full Name" required />
            <label>How long at Living Faith?</label
            ><select>
              <option>Less than 6 months</option>
              <option>6 months</option>
              <option>6-12 months</option>
              <option>1+ years</option>
            </select>
            <label>Ministry</label
            ><select>
              <option>Kids - Little Lights</option>
              <option>Worship</option>
              <option>Usher & Hospitality</option>
              <option>Media & Sound</option>
              <option>Outreach & Missions</option>
            </select>
            <label>Why this ministry?</label
            ><textarea rows="4" required></textarea>
            <button
              class="btn-form"
              style="
                background: transparent;
                color: var(--main);
                border: 1.5px solid var(--main);
              "
            >
              Volunteer
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
